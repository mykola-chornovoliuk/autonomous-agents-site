eader class="nav"><a class="logo" href="#top">ENOUGH<em>.</em></a><div class="langs"><button data-lang="ru">RU</button><button data-lang="uk">UK</button><button data-lang="en">EN</button></div></header></div><main id="top"><section class="hero"><div class="shell"><span class="sun"></span><div class="eyebrow">A GENTLER WAY TO LIVE</div><h1 id="hero"></h1><p id="lead"></p><a href="#discover" id="start"></a></div></section><section class="section shell" id="discover"><div class="eyebrow" id="sub"></div><h2 id="question"></h2><div class="choices" id="choices"></div><div class="answer"><div><div class="eyebrow">ENOUGH · A LITTLE POSSIBILITY</div><h3 id="answerTitle"></h3><p id="answerBody"></p></div><div><div class="eyebrow" id="small"></div><div class="steps" id="steps"></div></div></div></section><section class="section manifesto"><div class="shell"><div class="eyebrow">OUR PHILOSOPHY</div><h2 id="manifesto"></h2><p id="manifestoText"></p><div class="values" id="values"></div></div></section><section class="section shell journal" id="journal"><div><div class="eyebrow">A MOMENT TO NOTICE</div><h2 id="journalTitle"></h2><p class="intro" id="journalDesc"></p></div><div><textarea id="thought" maxlength="800"></textarea><button id="save" class="btn" type="button"></button><p class="journal-result" id="journalResult"></p></div></section></main><div class="shell"><footer class="footer"><span>ENOUGH · 2026</span><span>LESS EXCESS · MORE LIFE</span></footer></div><script>const data={"ru":{"hero":"Мир уже <em>полон.</em><br>Заметь его.","lead":"Иногда лучший способ получить желаемое — не покупать ничего нового. Давай увидим ценность того, что уже рядом.","start":"Открыть возможности ↓","question":"Чего тебе хочется сегодня?","sub":"Начнём с желания, а не с покупки.","small":"МАЛЕНЬКИЕ ШАГИ","manifesto":"Не обязательно иметь больше, чтобы жизнь стала богаче.","manifestoText":"Забота без назидания. Красота простого. Ремонт вместо лишней замены. Доверие между людьми. Уважение к при важність","Помічати людей, речі й природу довкола."],["Достатність","Шукати рішення, а не нову покупку."],["Доброта","Без сорому, тиску й прихованих продажів."]],"journal":"Що хорошого вже є поруч?","journalDesc":"Запиши маленьку радість сьогоднішнього дня. Вона залишиться тільки в цьому браузері.","placeholder":"Сьогодні я помітив...","save":"Зберегти для себе","saved":"Збережено лише на цьому пристрої. Нехай ця мить залишиться з тобою.","paths":[["🏡","Хочу затишку","Затишок ближче, ніж здається","Не все нове робить дім теплішим. Світло, тиша й улюблені речі іноді дають більше.",["Впусти більше денного світла.","Перестав одну улюблену річ.","Проведи двадцять хвилин без екрана."]],["🌳","Хочу відпочити","Відпочинок може бути поруч","Не кожна перерва потребує подорожі чи покупки.",["Прогуляйся серед дерев.","Поміть п'ять гарних деталей.","Дозволь собі годину без планів."]],["🧰","Потрібна допомога","Не мусиш робити все сам","Поруч можуть бути люди й речі, які допоможуть без зайвих витрат.",["Запитай, чи можна позичити інструмент.","Дізнайся, чи можна відремонтувати своє.","Подумай, з ким можна розділити завдання."]],["🌱","Хочу змін","Нове може початися зі старого","Іноді достатньо нового погляду, а не нової покупки.",["Полагодь давно забуту річ.","Передай корисне іншому.","Зміни звичку замість покупки."]]]},"en":{"hero":"The world is <em>already full.</em><br>Notice it.","lead":"Sometimes the best way to get what you need is not to buy anything new. Let's discover the value of what is already around you.","start":"Explore possibilities ↓","question":"What are you longing for today?","sub":"Let's start with a wish, not a purchase.","small":"SMALL STEPS","manifesto":"You don't need more possessions for a richer life.","manifestoText":"Care without lectures. Beauty in the ordinary. Repair before replacement. Trust between people. Respect for nature. Sometimes a good website should help you close the tab and go live.","values":[["Attention","Notice people, things and nature around you."],["Enoughness","Seek a solution, not another purchase."],["Kindness","No guilt, pressure or hidden selling."]],"journal":"What good is already around you?","journalDesc":"Write down one small joy from today. It stays only in this browser.","placeholder":"Today I noticed...","save":"Save for myself","saved":"Saved on this device only. Keep this moment close.","paths":[["🏡","I want comfort","Comfort may be closer than you think","New things don't always make a home warmer. Light, quiet and beloved objects may offer more.",["Let in some daylight.","Move one beloved object.","Spend twenty minutes without a screen."]],["🌳","I want rest","Rest may be nearby","Not every break needs a trip or a purchase.",["Walk among trees.","Notice five beautiful details.","Allow yourself an hour without plans."]],["🧰","I need help","You don't have to do it all alone","People and things nearby may help without unnecessary spending.",["Ask if you can borrow the tool.","See if yours can be repaired.","Think about who can share the task."]],["🌱","I want change","Something new can begin with something old","Sometimes a fresh perspective is better than a fresh purchase.",["Repair a neglected item.","Pass something useful on.","Change a habit instead of buying."]]]}};let lang="ru",active=0;const el=id=>document.getElementById(id);function render(){const d=data[lang];document.documentElement.lang=lang;el("hero").innerHTML=d.hero;for(const id of ["lead","start","question","sub","small","manifesto","manifestoText"]){el(id).textContent=d[id]};el("journalTitle").textContent=d.journal;el("journalDesc").textContent=d.journalDesc;el("thought").placeholder=d.placeholder;el("save").textContent=d.save;document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));el("choices").replaceChildren();d.paths.forEach((p,i)=>{const b=document.createElement("button");b.className="choice";b.type="button";b.setAttribute("aria-pressed",String(i===active));const em=document.createElement("span");em.className="symbol";em.textContent=p[0];const title=document.createElement("b");title.textContent=p[1];b.append(em,title);b.onclick=()=>{active=i;render()};el("choices").appendChild(b)});const p=d.paths[active];el("answerTitle").textContent=p[2];el("answerBody").textContent=p[3];el("steps").replaceChildren();p[4].forEach(t=>{const x=document.createElement("div");x.className="step";x.textContent=t;el("steps").appendChild(x)});el("values").replaceChildren();d.values.forEach(v=>{const x=document.createElement("div");x.className="value";const b=document.createElement("b");b.textContent=v[0];const p=document.createElement("p");p.textContent=v[1];x.append(b,p);el("values").appendChild(x)});el("journalResult").textContent=""}document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("enough-lang",lang)}catch{}render()});el("save").onclick=()=>{try{localStorage.setItem("enough-thought",el("thought").value)}catch{}el("journalResult").textContent=data[lang].saved};try{lang=localStorage.getItem("enough-lang")||"ru";if(!data[lang])lang="ru";el("thought").value=localStorage.getItem("enough-thought")||""}catch{}render();</script></body></html>
